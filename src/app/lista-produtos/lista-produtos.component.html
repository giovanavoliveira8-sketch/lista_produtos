<div id="div-form">
    <h3>LISTA PRODUTOS</h3>

    <form id="formulario">
        <label for="descricao">Descrição do produto: </label>
        <input type="text" name="descricao" id="descricao_produto" [(ngModel)] = "descricao_produto">

        <label for="valr">Valor do produto: </label>
        <input type="text" name="valor" id="valor_unitario" [(ngModel)] = "valor_unitario">

        <div id="div-btns">
        <button type="button" id="btnAdd" (click)="addItem()" > Adicionar </button>
        <button type="button" id="limpar" (click)="limparTudo()"> Limpar Tudo </button>
    </div>
    
    </form>

    <hr>
    
    <div id="div-list">

        @for(elem of listaItens; track elem.idProduto){
            <div class="div-item"> 
                
                <input type="checkbox" [checked]="elem.statusSelecionado">
                 &nbsp; &nbsp; 

                {{elem.idProduto}} - {{elem.descricaoProduto}} R$ {{elem.valorUnitario}} 
            </div>
        }@empty{
            <div class="div-item"> Não há nenhum produto </div>
        }
      
    </div>

</div>
